services:
  db:
    image: mariadb:11
    container_name: ganacontrol_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ganacontrol
      MARIADB_USER: ganacontrol
      MARIADB_PASSWORD: ganacontrol
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: ganacontrol_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    # Si quieres que SIEMPRE arranque con migraciones+seed (solo DEV), descomenta:
    # command: >
    #   sh -c "npx sequelize-cli db:migrate &&
    #          npx sequelize-cli db:seed:all &&
    #          npm run dev"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ganacontrol_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"

volumes:
  dbdata: